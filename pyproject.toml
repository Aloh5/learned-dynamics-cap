[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "learned-dynamics-cap"
version = "0.1.0"
description = "Dense polynomial surrogate reconstruction and validated periodic orbits"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "pandas>=2", "matplotlib>=3.7", "scikit-learn>=1.3"]

[project.optional-dependencies]
notebooks = ["jupyterlab>=4", "nbclient>=0.10", "nbformat>=5", "ddeint>=0.3"]

[tool.setuptools.packages.find]
include = ["dpsr*"]
